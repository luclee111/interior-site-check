];
const SPECIAL={
curtain:{title:'커튼 업체 전달용 현장 실측',copy:`안녕하세요. 커튼 견적/실측 상담 요청드립니다.\n\n[거실]\n- 커튼박스 너비: 3817 mm\n- 커튼박스 깊이: 120 mm\n- 높이 기록: 2320~2335 mm\n- 창측 벽 전체가 샷시\n\n[침실]\n- 샷시 포함 너비: 2615 mm\n- 벽면 전체 너비: 3602 mm\n- 커튼박스 깊이: 120 mm\n- 높이: 2335 mm\n\n[서재]\n- 커튼박스 너비: 2705 mm\n- 깊이: 120 mm\n- 높이 기록이 2305 mm와 2335 mm로 상충하여 재실측 필요\n\n원하는 방향: 2중 레일 검토. 거실은 속커튼+겉커튼 계획.\n확인 부탁: ① 120mm 박스에서 2중 레일 가능 여부 ② 최종 레일/원단 주문 치수 현장 재실측 ③ 바닥 마감 후 커튼 길이 ④ 에어컨/간접조명 간섭 ⑤ 원단 주름배수와 양옆 스택 폭.`},
blind:{title:'전면 베란다 블라인드 업체 전달용 현장 실측',copy:`안녕하세요. 전면 베란다 블라인드 견적/실측 상담 요청드립니다.\n\n[현장 기록]\n- 중앙 구간 너비: 3915 mm / 하부가 바닥에서 245 mm\n- 왼쪽 구간 너비: 2345 mm / 하부가 바닥에서 410 mm\n- 오른쪽 구간 너비: 2898 mm / 하부가 바닥에서 410 mm\n- 벽 높이: 2420 mm\n- 샷시 높이는 현장 기록이 미완성이라 재실측 필요\n\n현재 값은 참고치이며 주문 치수는 현장 실측 후 확정하고 싶습니다.\n확인 부탁: ① 내측/외측 설치 중 적합 방식 ② 3구간 분할 여부 ③ 각 구간 실제 설치 높이 ④ 창 손잡이/미닫이 개폐 간섭 ⑤ 체인 위치 ⑥ 원단 종류·개방률·색상 ⑦ 설치면 깊이/브라켓 고정 가능 여부.`}
};
const sb=createInteriorSupabase();let user=null,project=null,rows=[],allField=[],photoMeta=[],photoByItem=new Map(),statusFilter='';const list=document.getElementById('list');
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}function seed(id){return SEED.find(x=>x.id===id)}function raw(x){return x.raw_data||{}}
async function guard(){const {data}=await sb.auth.getUser();if(!data.user){location.href='./cloud-login.html?next='+encodeURIComponent(location.pathname);return false}user=data.user;return true}
async function getProject(){const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false}).limit(1).single();if(error)throw error;project=data;document.getElementById('projectLabel').textContent=(project.name||'현장 프로젝트')+(project.meeting_date?' · '+project.meeting_date:'')+' · Supabase 동기화'}
function seedRow(s,i){return{project_id:project.id,source:'todo',source_item_id:s.id,room_id:'todo',room_name:s.room,title:s.title,details:[s.why],critical:s.p==='P0',checked:false,consulted:false,finalized:false,decision_status:'',workflow_status:'todo',consult_note:s.why,decision_text:'',action:'',owner_name:s.owner,raw_data:{category:s.c,priority:s.p,owner:s.owner,why:s.why,seedVersion:'2026-09-13-v2'},sort_order:10000+i}}
async function ensureSeeds(){const {data,error}=await sb.from('field_items').select('*').eq('project_id',project.id).eq('source','todo').order('sort_order');if(error)throw error;const existing=new Set((data||[]).map(x=>x.source_item_id)),missing=SEED.filter(x=>!existing.has(x.id));if(missing.length){const {error:ie}=await sb.from('field_items').insert(missing.map(x=>seedRow(x,SEED.indexOf(x))));if(ie)throw ie}await loadAll()}
async function loadAll(){const {data,error}=await sb.from('field_items').select('*').eq('project_id',project.id).order('sort_order');if(error)throw error;allField=data||[];rows=allField.filter(x=>x.source==='todo');const {data:ps,error:pe}=await sb.from('field_photos').select('*').eq('project_id',project.id);if(pe)throw pe;photoMeta=ps||[];const paths=photoMeta.map(x=>x.storage_path);if(paths.length){const {data:signed,error:se}=await sb.storage.from('site-photos').createSignedUrls(paths,3600);if(se)throw se;signed.forEach((x,i)=>photoMeta[i].url=x.signedUrl)}photoByItem=new Map();for(const p of photoMeta){if(!photoByItem.has(p.item_id))photoByItem.set(p.item_id,[]);photoByItem.get(p.item_id).push(p)}buildFilters();render()}
function sourceRowsFor(todo){const s=seed(todo.source_item_id),refs=s?.refs||[];return allField.filter(r=>refs.includes(r.source_item_id))}function sourceText(r){const a=[];if(Array.isArray(r.details)&&r.details.length)a.push(r.details.join(' / '));if(r.consult_note)a.push('현장메모: '+r.consult_note);if(r.decision_text)a.push('결정: '+r.decision_text);return a.join('\n')}
function relatedPhotos(todo){const s=seed(todo.source_item_id),direct=[];for(const r of sourceRowsFor(todo))for(const p of(photoByItem.get(r.id)||[]))direct.push({...p,label:r.title||r.room_name||'현장사진'});for(const p of(photoByItem.get(todo.id)||[]))direct.unshift({...p,label:'To-do 사진'});if(direct.length)return direct.slice(0,12);const rooms=(todo.room_name||'').split('·').map(x=>x.trim());const fallback=[];for(const r of allField){if(r.source==='todo')continue;if(rooms.some(x=>x&&String(r.room_name||'').includes(x)))for(const p of(photoByItem.get(r.id)||[]))fallback.push({...p,label:'같은 공간 · '+(r.title||r.room_name)})}return fallback.slice(0,8)}
function buildFilters(){const cats=[...new Set(rows.map(x=>raw(x).category||seed(x.source_item_id)?.c).filter(Boolean))],owners=[...new Set(rows.map(x=>x.owner_name).filter(Boolean))];const c=document.getElementById('category'),o=document.getElementById('owner'),cv=c.value,ov=o.value;c.innerHTML='<option value="">모든 카테고리</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');o.innerHTML='<option value="">모든 담당</option>'+owners.map(x=>`<option>${esc(x)}</option>`).join('');if(cats.includes(cv))c.value=cv;if(owners.includes(ov))o.value=ov}
function pri(x){return raw(x).priority||seed(x.source_item_id)?.p||''}function cat(x){return raw(x).category||seed(x.source_item_id)?.c||'기타'}function setFilter(s){statusFilter=s;render()}function renderSummary(){const active=rows.filter(x=>x.workflow_status!=='done').length,done=rows.filter(x=>x.workflow_status==='done').length,p0=rows.filter(x=>pri(x)==='P0'&&x.workflow_status!=='done').length,hold=rows.filter(x=>x.workflow_status==='hold').length;const defs=[['','전체',rows.length],['active','진행 필요',active],['p0','P0 지금',p0],['hold','보류',hold],['done','완료',done]];document.getElementById('summary').innerHTML=defs.map(([k,n,c])=>`<button class="${statusFilter===k?'on':''}" onclick="setFilter('${k}')"><b>${c}</b><span>${n}</span></button>`).join('')}
function match(x){const q=document.getElementById('search').value.trim().toLowerCase(),cv=document.getElementById('category').value,pv=document.getElementById('priority').value,ov=document.getElementById('owner').value;if(statusFilter==='active'&&x.workflow_status==='done')return false;if(statusFilter==='done'&&x.workflow_status!=='done')return false;if(statusFilter==='hold'&&x.workflow_status!=='hold')return false;if(statusFilter==='p0'&&(pri(x)!=='P0'||x.workflow_status==='done'))return false;if(cv&&cat(x)!==cv)return false;if(pv&&pri(x)!==pv)return false;if(ov&&x.owner_name!==ov)return false;if(q&&!([x.title,x.room_name,x.consult_note,x.action,x.decision_text,x.owner_name,cat(x),pri(x)].join(' ').toLowerCase().includes(q)))return false;return true}
function specialHtml(x){const s=seed(x.source_item_id);if(!s?.special)return'';const sp=SPECIAL[s.special];let measures='';if(s.special==='curtain')measures=`<div class="measureGrid"><div class="measure"><b>거실</b><span>너비 3817 mm<br>깊이 120 mm<br>높이 2320~2335 mm<br>벽 전체 샷시</span></div><div class="measure"><b>침실</b><span>샷시 포함 2615 mm<br>벽 전체 3602 mm<br>깊이 120 mm<br>높이 2335 mm</span></div><div class="measure"><b>서재</b><span>너비 2705 mm<br>깊이 120 mm<br><span class="warn">높이 2305 / 2335 기록 상충 → 재확인</span></span></div></div>`;if(s.special==='blind')measures=`<div class="measureGrid"><div class="measure"><b>중앙</b><span>너비 3915 mm<br>하부 바닥에서 245 mm</span></div><div class="measure"><b>왼쪽</b><span>너비 2345 mm<br>하부 바닥에서 410 mm</span></div><div class="measure"><b>오른쪽</b><span>너비 2898 mm<br>하부 바닥에서 410 mm</span></div></div><div class="sourceBox">벽 높이 2420 mm · 샷시 높이 기록은 미완성 → 주문 전 업체 재실측 필수</div>`;const src=sourceRowsFor(x).map(r=>`<div class="sourceBox"><b>${esc(r.room_name||'')} · ${esc(r.title||'현장 기록')}</b>\n${esc(sourceText(r)||'별도 텍스트 기록 없음')}</div>`).join('');return`<div class="consult"><h4>📐 ${esc(sp.title)}</h4>${measures}<div class="consultText">${esc(sp.copy)}</div><div class="consultActions"><button onclick="copyConsult('${s.special}')">📋 업체 전달문 복사</button><button onclick="this.closest('.consult').querySelector('.consultText').classList.toggle('hidden')">전달문 접기/펼치기</button></div>${src}</div>`}
function photoHtml(x){const ps=relatedPhotos(x),id=x.id;return`<div class="photos"><div class="photosHead"><b>📷 참고 현장사진 ${ps.length?ps.length+'장':''}</b><label class="btn photoBtn">+ 이 To-do에 사진 추가<input class="photoAdd" type="file" accept="image/*" onchange="addTodoPhoto('${id}',this.files[0]);this.value=''"/></label></div>${ps.length?`<div class="photoGrid">${ps.map(p=>`<div class="photo"><img src="${p.url}" onclick="openPhoto('${p.url}')"><small>${esc(p.label||'현장사진')}</small></div>`).join('')}</div>`:'<div class="noPhoto">직접 연결된 사진이 없어 같은 공간 사진도 찾지 못했습니다. 필요하면 여기서 사진을 추가하세요.</div>'}</div>`}
function render(){renderSummary();const arr=rows.filter(match);if(!arr.length){list.innerHTML='<div class="empty">조건에 맞는 할 일이 없습니다.</div>';return}let last='',html='';for(const x of arr){const c=cat(x);if(c!==last){html+=`<div class="catTitle">${esc(c)}</div>`;last=c}const done=x.workflow_status==='done';html+=`<article class="todo ${done?'doneCard':''}" id="t-${x.id}"><div class="head"><button class="check ${done?'done':''}" onclick="toggleDone('${x.id}')">${done?'✓':'□'}</button><div><div class="title">${esc(x.title)}</div><div class="meta"><span class="tag ${pri(x).toLowerCase()}">${esc(pri(x))}</span><span class="tag">${esc(x.room_name||'')}</span><span class="tag">${esc(x.owner_name||'담당 미정')}</span></div></div><div class="tag">${esc(x.workflow_status||'todo')}</div></div><div class="body"><div class="why">${esc(x.consult_note||seed(x.source_item_id)?.why||'')}</div>${specialHtml(x)}${photoHtml(x)}<div class="edit"><select data-status="${x.id}"><option value="todo" ${x.workflow_status==='todo'?'selected':''}>진행 필요</option><option value="hold" ${x.workflow_status==='hold'?'selected':''}>보류/답변대기</option><option value="done" ${x.workflow_status==='done'?'selected':''}>완료</option></select><input data-owner="${x.id}" value="${esc(x.owner_name||'')}" placeholder="담당"><input data-decision="${x.id}" value="${esc(x.decision_text||'')}" placeholder="결정/결과"><textarea data-action="${x.id}" placeholder="메모·다음 액션">${esc(x.action||'')}</textarea><button class="save" onclick="saveTodo('${x.id}')">저장</button></div></div></article>`}list.innerHTML=html}
async function saveTodo(id){const x=rows.find(v=>v.id===id),workflow_status=document.querySelector(`[data-status="${id}"]`).value,owner_name=document.querySelector(`[data-owner="${id}"]`).value,decision_text=document.querySelector(`[data-decision="${id}"]`).value,action=document.querySelector(`[data-action="${id}"]`).value;const {error}=await sb.from('field_items').update({workflow_status,finalized:workflow_status==='done',checked:workflow_status==='done',owner_name,decision_text,action}).eq('id',id);if(error)return alert('저장 실패: '+error.message);Object.assign(x,{workflow_status,finalized:workflow_status==='done',checked:workflow_status==='done',owner_name,decision_text,action});render()}
async function toggleDone(id){const x=rows.find(v=>v.id===id),next=x.workflow_status==='done'?'todo':'done';const {error}=await sb.from('field_items').update({workflow_status:next,finalized:next==='done',checked:next==='done'}).eq('id',id);if(error)return alert('저장 실패: '+error.message);x.workflow_status=next;x.finalized=next==='done';x.checked=next==='done';render()}
function copyConsult(k){navigator.clipboard.writeText(SPECIAL[k].copy).then(()=>alert('업체 전달문을 복사했습니다.')).catch(()=>prompt('아래 내용을 복사하세요.',SPECIAL[k].copy))}function openPhoto(url){document.getElementById('modalImg').src=url;document.getElementById('photoModal').classList.add('open')}function closePhoto(){document.getElementById('photoModal').classList.remove('open');document.getElementById('modalImg').src=''}
async function compress(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{let w=img.width,h=img.height,max=1600;if(w>max){h=Math.round(h*max/w);w=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>res(b),'image/jpeg',.8)};img.onerror=rej;img.src=u})}
async function addTodoPhoto(rowId,file){if(!file)return;try{const blob=await compress(file),path=user.id+'/'+project.id+'/todo/'+rowId+'/'+crypto.randomUUID()+'.jpg';const {error:ue}=await sb.storage.from('site-photos').upload(path,blob,{contentType:'image/jpeg'});if(ue)throw ue;const {error:me}=await sb.from('field_photos').insert({project_id:project.id,item_id:rowId,source_photo_id:'todo-'+Date.now(),storage_path:path,file_name:path.split('/').pop(),mime_type:'image/jpeg'});if(me)throw me;await loadAll()}catch(e){alert('사진 업로드 실패: '+e.message)}}
['search','category','priority','owner'].forEach(id=>document.getElementById(id).addEventListener('input',render));
(async()=>{try{if(!await guard())return;await getProject();await ensureSeeds()}catch(e){console.error(e);list.innerHTML='<div class="empty">불러오기 실패: '+esc(e.message)+'<br><br>field_items_source_check 오류라면 Supabase에서 todo source 허용 migration이 적용됐는지 확인해주세요.</div>'}})();
</script></body></html>
