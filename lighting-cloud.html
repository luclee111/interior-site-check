<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>조명 계획 · Supabase 동기화</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f3ef}#app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f5f3ef}.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#445;background:#f5f3ef;z-index:5}.loading.hide{display:none}.loadbox{text-align:center;max-width:420px;padding:24px}.spinner{width:22px;height:22px;border:3px solid #d7dce2;border-top-color:#315d8c;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}.sub{font-size:12px;color:#777;margin-top:8px;line-height:1.5}.retry{display:none;margin:14px auto 0;border:1px solid #cfd3d8;background:#fff;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div class="loading" id="loading"><div class="loadbox"><div class="spinner"></div><div id="loadText">☁️ Supabase 로그인 확인 중…</div><div class="sub" id="loadSub">기록을 준비하고 있어요.</div><button class="retry" id="retryBtn" onclick="location.reload()">다시 불러오기</button></div></div><iframe id="app" title="조명 계획 · Supabase 동기화"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
(async()=>{
 const loading=document.getElementById('loading'),text=document.getElementById('loadText'),sub=document.getElementById('loadSub'),retry=document.getElementById('retryBtn'),frame=document.getElementById('app');
 const fail=(m)=>{text.textContent='불러오기 실패';sub.textContent=m;retry.style.display='block'};
 const timer=setTimeout(()=>{text.textContent='불러오기가 오래 걸리고 있어요';sub.textContent='네트워크 또는 브라우저 캐시 문제일 수 있습니다. 새로고침해도 안전합니다.';retry.style.display='block'},20000);
 try{
   const sb=createInteriorSupabase();window.__sb=sb;
   const {data,error}=await sb.auth.getUser();
   if(error||!data.user){location.href='./cloud-login.html?next='+encodeURIComponent(location.pathname+location.search);return}
   window.__cloudUser=data.user;text.textContent='☁️ 현장 프로젝트 확인 중…';
   const requested=new URLSearchParams(location.search).get('project');
   const {data:projects,error:pe}=await sb.from('projects').select('*').order('created_at',{ascending:false}).limit(20);
   if(pe){clearTimeout(timer);fail('프로젝트 로드 실패: '+pe.message);return}
   const p=requested?projects?.find(x=>x.id===requested):projects?.[0];
   if(!p){location.href='./cloud-import.html';return}
   window.__cloudProject=p;text.textContent='☁️ 조명 화면 불러오는 중…';
   frame.onload=()=>{
     try{
       text.textContent='☁️ Supabase 기록 동기화 중…';
       const doc=frame.contentDocument;if(!doc||!doc.body){clearTimeout(timer);fail('조명 화면을 읽지 못했습니다.');return}
       const s=doc.createElement('script');s.src='./lighting-cloud-bridge.js?v=20260923b';
       s.onload=()=>{
         const u=doc.createElement('script');u.src='./cloud-ui-fixes.js?v=20260923b';doc.body.appendChild(u);
         clearTimeout(timer);loading.classList.add('hide');
       };
       s.onerror=()=>{clearTimeout(timer);fail('동기화 모듈을 불러오지 못했습니다. 새로고침해주세요.')};
       doc.body.appendChild(s);
     }catch(e){clearTimeout(timer);fail('화면 연결 오류: '+e.message)}
   };
   frame.onerror=()=>{clearTimeout(timer);fail('조명 기본 화면을 불러오지 못했습니다.')};
   frame.src='./lighting.html?embedded=1&v=20260923b';
 }catch(e){clearTimeout(timer);fail(e.message||String(e))}
})();
</script></body></html>
