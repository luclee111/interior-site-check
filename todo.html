['todo-electrical-test','후공정 검수','P2','공통','나/전기팀','전체 콘센트·스위치·차단기 기능 검수','모든 추가/이설 콘센트, 조명 회로, 센서, 전용회로를 하나씩 작동 확인하고 분전반 차단기 라벨과 실제 부하가 맞는지 확인.'],
['todo-lighting-night-test','후공정 검수','P2','공통','나','입주 전 야간 조명 장면 최종 점검','밤에 현관 거울 반사, 거실 유리 반사/눈부심, 식탁 펜던트 높이, 침실 눈부심, 간접조명 LED 점노출/핫스팟을 실제 점등 상태에서 확인.']
];
const sb=createInteriorSupabase();let user=null,project=null,rows=[],statusFilter='';const list=document.getElementById('list');
function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
async function guard(){const {data}=await sb.auth.getUser();if(!data.user){location.href='./cloud-login.html?next='+encodeURIComponent(location.pathname);return false}user=data.user;return true}
async function getProject(){const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false}).limit(1).single();if(error)throw error;project=data;document.getElementById('projectLabel').textContent=(project.name||'현장 프로젝트')+(project.meeting_date?' · '+project.meeting_date:'')+' · Supabase 동기화'}
function seedRow(t,i){const [id,category,priority,room,owner,title,why]=t;return{project_id:project.id,source:'todo',source_item_id:id,room_id:'todo',room_name:room,title,details:[why],critical:priority==='P0',checked:false,consulted:false,finalized:false,decision_status:'',workflow_status:'todo',consult_note:why,decision_text:'',action:'',owner_name:owner,raw_data:{category,priority,owner,why,seedVersion:'2026-09-13-v1'},sort_order:10000+i}}
async function ensureSeeds(){const {data,error}=await sb.from('field_items').select('*').eq('project_id',project.id).eq('source','todo').order('sort_order');if(error)throw error;const existing=new Set((data||[]).map(x=>x.source_item_id)),missing=SEED.filter(x=>!existing.has(x[0]));if(missing.length){const payload=missing.map((x)=>seedRow(x,SEED.findIndex(y=>y[0]===x[0])));const {error:ie}=await sb.from('field_items').insert(payload);if(ie)throw ie}await loadRows()}
async function loadRows(){const {data,error}=await sb.from('field_items').select('*').eq('project_id',project.id).eq('source','todo').order('sort_order');if(error)throw error;rows=data||[];buildFilters();render()}
function raw(x){return x.raw_data||{}}
function buildFilters(){const cats=[...new Set(rows.map(x=>raw(x).category).filter(Boolean))],owners=[...new Set(rows.map(x=>x.owner_name).filter(Boolean))];const c=document.getElementById('category'),o=document.getElementById('owner'),cv=c.value,ov=o.value;c.innerHTML='<option value="">모든 카테고리</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');o.innerHTML='<option value="">모든 담당</option>'+owners.map(x=>`<option>${esc(x)}</option>`).join('');if(cats.includes(cv))c.value=cv;if(owners.includes(ov))o.value=ov}
function setFilter(s){statusFilter=s;render()}
function renderSummary(){const active=rows.filter(x=>x.workflow_status!=='done').length,done=rows.filter(x=>x.workflow_status==='done').length,p0=rows.filter(x=>raw(x).priority==='P0'&&x.workflow_status!=='done').length,hold=rows.filter(x=>x.workflow_status==='hold').length;const defs=[['','전체',rows.length],['active','진행 필요',active],['p0','P0 지금',p0],['hold','보류',hold],['done','완료',done]];document.getElementById('summary').innerHTML=defs.map(([k,n,c])=>`<button class="${statusFilter===k?'on':''}" onclick="setFilter('${k}')"><b>${c}</b><span>${n}</span></button>`).join('')}
function match(x){const q=document.getElementById('search').value.trim().toLowerCase(),cat=document.getElementById('category').value,pr=document.getElementById('priority').value,own=document.getElementById('owner').value,r=raw(x);if(statusFilter==='active'&&x.workflow_status==='done')return false;if(statusFilter==='done'&&x.workflow_status!=='done')return false;if(statusFilter==='hold'&&x.workflow_status!=='hold')return false;if(statusFilter==='p0'&&(r.priority!=='P0'||x.workflow_status==='done'))return false;if(cat&&r.category!==cat)return false;if(pr&&r.priority!==pr)return false;if(own&&x.owner_name!==own)return false;if(q&&!([x.title,x.room_name,x.consult_note,x.action,x.decision_text,x.owner_name,r.category,r.priority].join(' ').toLowerCase().includes(q)))return false;return true}
function render(){renderSummary();const arr=rows.filter(match);if(!arr.length){list.innerHTML='<div class="empty">조건에 맞는 할 일이 없습니다.</div>';return}let last='',html='';for(const x of arr){const r=raw(x),cat=r.category||'기타';if(cat!==last){html+=`<div class="catTitle">${esc(cat)}</div>`;last=cat}const done=x.workflow_status==='done';html+=`<article class="todo ${done?'doneCard':''}" id="t-${x.id}"><div class="head"><button class="check ${done?'done':''}" onclick="toggleDone('${x.id}')">${done?'✓':'□'}</button><div><div class="title">${esc(x.title)}</div><div class="meta"><span class="tag ${String(r.priority||'').toLowerCase()}">${esc(r.priority||'')}</span><span class="tag">${esc(x.room_name||'')}</span><span class="tag">${esc(x.owner_name||'담당 미정')}</span></div></div><div class="tag">${esc(x.workflow_status||'todo')}</div></div><div class="body"><div class="why">${esc(x.consult_note||r.why||'')}</div><div class="edit"><select data-status="${x.id}"><option value="todo" ${x.workflow_status==='todo'?'selected':''}>진행 필요</option><option value="hold" ${x.workflow_status==='hold'?'selected':''}>보류/답변대기</option><option value="done" ${x.workflow_status==='done'?'selected':''}>완료</option></select><input data-owner="${x.id}" value="${esc(x.owner_name||'')}" placeholder="담당"><input data-decision="${x.id}" value="${esc(x.decision_text||'')}" placeholder="결정/결과"><textarea data-action="${x.id}" placeholder="메모·다음 액션">${esc(x.action||'')}</textarea><button class="save" onclick="saveTodo('${x.id}')">저장</button></div></div></article>`}list.innerHTML=html}
async function saveTodo(id){const x=rows.find(v=>v.id===id),workflow_status=document.querySelector(`[data-status="${id}"]`).value,owner_name=document.querySelector(`[data-owner="${id}"]`).value,decision_text=document.querySelector(`[data-decision="${id}"]`).value,action=document.querySelector(`[data-action="${id}"]`).value;const {error}=await sb.from('field_items').update({workflow_status,finalized:workflow_status==='done',checked:workflow_status==='done',owner_name,decision_text,action}).eq('id',id);if(error)return alert('저장 실패: '+error.message);Object.assign(x,{workflow_status,finalized:workflow_status==='done',checked:workflow_status==='done',owner_name,decision_text,action});render()}
async function toggleDone(id){const x=rows.find(v=>v.id===id),next=x.workflow_status==='done'?'todo':'done';const {error}=await sb.from('field_items').update({workflow_status:next,finalized:next==='done',checked:next==='done'}).eq('id',id);if(error)return alert('저장 실패: '+error.message);x.workflow_status=next;x.finalized=next==='done';x.checked=next==='done';render()}
['search','category','priority','owner'].forEach(id=>document.getElementById(id).addEventListener('input',render));
(async()=>{try{if(!await guard())return;await getProject();await ensureSeeds()}catch(e){console.error(e);list.innerHTML='<div class="empty">불러오기 실패: '+esc(e.message)+'</div>'}})();
</script></body></html>
