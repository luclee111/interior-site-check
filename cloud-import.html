<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>기존 현장기록 가져오기</title><style>:root{--bg:#f5f3ef;--card:#fff;--ink:#20242a;--muted:#697078;--line:#ddd9d2;--blue:#315d8c;--green:#2f7d4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}main{max-width:820px;margin:auto;padding:22px 12px 70px}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.top h1{margin:0;font-size:clamp(25px,4vw,36px);letter-spacing:-.04em}.right{display:flex;gap:7px;flex-wrap:wrap}button,.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:750;text-decoration:none;cursor:pointer}.good{background:var(--green);border-color:var(--green);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,35,40,.06);margin:12px 0}.muted,.msg{color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap}.drop{border:2px dashed #b7c2ce;border-radius:16px;padding:22px;text-align:center;background:#fafcff}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.summary div{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.summary b{display:block;font-size:20px}.summary span{font-size:11px;color:var(--muted)}.progress{height:10px;background:#e6e8eb;border-radius:999px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:var(--green);transition:.15s}.hidden{display:none!important}@media(max-width:650px){.top{flex-direction:column}.right{width:100%}.right>*{flex:1;text-align:center}.summary{grid-template-columns:1fr 1fr}input{font-size:16px}}</style></head><body><main><div class="top"><div><h1>☁️ 기존 현장기록 가져오기</h1><div class="muted">백업 JSON의 기록과 사진을 Supabase DB + Private Storage로 옮깁니다.</div></div><div class="right"><a class="btn" href="./cloud-review.html">현장결과</a><button id="logout">로그아웃</button></div></div><section class="card"><div class="drop"><input id="file" type="file" accept=".json,application/json"><p class="muted">interior_site_backup_....json 파일을 선택하세요.</p></div><div id="preview" class="hidden"><div class="summary"><div><b id="nLight">0</b><span>조명 항목</span></div><div><b id="nOutlet">0</b><span>콘센트 항목</span></div><div><b id="nPhotos">0</b><span>사진</span></div><div><b id="nCustom">0</b><span>직접 추가</span></div></div><button class="good" id="importBtn" style="width:100%;margin-top:14px">Supabase로 가져오기</button></div><div class="progress hidden" id="prog"><i></i></div><div class="msg" id="msg"></div></section><section class="card"><b>한 번만 가져오세요.</b><p class="muted">동일한 백업을 여러 번 가져오면 프로젝트가 중복 생성될 수 있습니다. 가져오기가 끝나면 다른 브라우저에서도 같은 GitHub 계정으로 로그인해 동일한 사진과 기록을 볼 수 있습니다.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=createInteriorSupabase();let user=null,payload=null,lightingMap={},lightRooms={},outletMap={};const msg=document.getElementById('msg'),prog=document.getElementById('prog'),bar=prog.querySelector('i');
function say(x){msg.textContent=x}function escRE(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
async function buildMaps(){try{const [lt,ot]=await Promise.all([fetch('./lighting.html').then(r=>r.text()),fetch('./outlets.html').then(r=>r.text())]);const sm=lt.match(/const SEED=(\{.*?\});\s*let state=/s);if(sm){const seed=JSON.parse(sm[1]);lightRooms=Object.fromEntries(seed.rooms.map(r=>[r.id,r.name]));lightingMap=Object.fromEntries(seed.items.map(i=>[i.id,i]));}const rm=ot.match(/const rooms = (\[.*?\]);\s*const STORAGE_KEY/s);if(rm){const rooms=JSON.parse(rm[1]);for(const r of rooms){r.items.forEach((it,i)=>{outletMap[r.id+'-'+i]={room:r.id,roomName:r.name,title:it[0],details:[it[1]],critical:r.priority==='high',priority:it[2],visibility:it[3]};});}}}catch(e){console.warn('definition map load failed',e)}}
function statusLight(d,def){if(d?.decisionStatus==='hold')return'hold';if(d?.action?.trim())return'todo';if(d?.decisionText?.trim())return'confirmed';if(d?.checked||d?.consulted)return'review';return def?.critical?'todo':'review'}
function statusOutlet(d){if(d?.finalized||d?.finalDecision?.trim())return'confirmed';if(d?.decisionStatus==='보류'||d?.decisionStatus==='변경 필요')return'hold';if(d?.followup?.trim())return'todo';if(d?.checked||d?.consulted)return'review';return'todo'}
function dataUrlToBlob(s){const [h,b]=s.split(','),m=(h.match(/data:(.*?);base64/)||[])[1]||'image/jpeg',bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m})}function ext(m){return m==='image/png'?'png':m==='image/webp'?'webp':'jpg'}
(async()=>{await buildMaps();const {data}=await sb.auth.getUser();if(!data.user){location.href='./cloud-login.html';return}user=data.user})();
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./cloud-login.html'};
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{payload=JSON.parse(await f.text());if(payload.app!=='interior-site-check-backup')throw new Error('백업 형식이 아닙니다.');const ls=payload.lighting?.data?.state?.items||{},os=payload.outlets?.data?.items||{},lp=payload.lighting?.photos||[],op=Object.values(os).reduce((n,x)=>n+(x.photos||[]).length,0),cu=payload.lighting?.data?.customItems||[];nLight.textContent=Object.keys(ls).length;nOutlet.textContent=Object.keys(os).length;nPhotos.textContent=lp.length+op;nCustom.textContent=cu.length;preview.classList.remove('hidden');say('백업을 읽었습니다. 아래 버튼을 눌러 클라우드로 옮기세요.');}catch(err){payload=null;say('파일 오류: '+err.message)}};
importBtn.onclick=async()=>{if(!payload||!user)return;importBtn.disabled=true;prog.classList.remove('hidden');bar.style.width='2%';try{const meta=payload.lighting?.data?.state?.meta||{},name=meta.name||'인테리어 현장기록',date=meta.meetingDate||null;const {data:old,error:oe}=await sb.from('projects').select('id,name,meeting_date').eq('name',name);if(oe)throw oe;if(old?.some(x=>String(x.meeting_date||'')===String(date||''))&&!confirm('같은 이름/날짜 프로젝트가 있습니다. 새 프로젝트로 또 가져올까요?')){importBtn.disabled=false;return}const {data:p,error:pe}=await sb.from('projects').insert({owner_id:user.id,name,meeting_date:date,consultant:meta.consultant||null,source_exported_at:payload.exportedAt||null}).select().single();if(pe)throw pe;const rows=[];let order=0,ls=payload.lighting?.data?.state?.items||{},customs=payload.lighting?.data?.customItems||[],custom=Object.fromEntries(customs.map(x=>[x.id,x]));for(const [sid,d] of Object.entries(ls)){const def=lightingMap[sid]||custom[sid]||{room:'common',title:sid,details:[],critical:false};rows.push({project_id:p.id,source:'lighting',source_item_id:sid,room_id:def.room||'common',room_name:lightRooms[def.room]||def.room||'기타',title:def.title||sid,details:def.details||[],critical:!!def.critical,checked:!!d.checked,consulted:!!d.consulted,decision_status:d.decisionStatus||'undecided',workflow_status:statusLight(d,def),consult_note:d.consultNote||null,decision_text:d.decisionText||null,action:d.action||null,owner_name:d.owner||null,raw_data:d,sort_order:order++})}const os=payload.outlets?.data?.items||{};for(const [sid,d] of Object.entries(os)){const def=outletMap[sid]||{room:'common',roomName:'기타',title:sid,details:[],critical:false};rows.push({project_id:p.id,source:'outlets',source_item_id:sid,room_id:def.room||'common',room_name:def.roomName||'기타',title:def.title||sid,details:def.details||[],critical:!!def.critical,checked:!!d.checked,consulted:!!d.consulted,finalized:!!d.finalized,decision_status:d.decisionStatus||'',workflow_status:statusOutlet(d),consult_note:d.teamNote||null,decision_text:d.finalDecision||null,action:d.followup||null,count_text:d.count||null,height_text:d.height||null,type_text:d.type||null,circuit_text:d.circuit||null,change_type:d.changeType||null,raw_data:d,sort_order:order++})}say('항목 '+rows.length+'개 업로드 중…');bar.style.width='10%';const inserted=[];for(let i=0;i<rows.length;i+=40){const {data,error}=await sb.from('field_items').insert(rows.slice(i,i+40)).select('id,source,source_item_id');if(error)throw error;inserted.push(...data);bar.style.width=(10+Math.round(35*Math.min(rows.length,i+40)/rows.length))+'%'}const map=new Map(inserted.map(x=>[x.source+'|'+x.source_item_id,x.id])),jobs=[];for(const ph of(payload.lighting?.photos||[]))if(ph?.data&&map.has('lighting|'+ph.itemId))jobs.push({source:'lighting',sid:ph.itemId,itemId:map.get('lighting|'+ph.itemId),photoId:ph.id||crypto.randomUUID(),data:ph.data});for(const [sid,d] of Object.entries(os))for(let i=0;i<(d.photos||[]).length;i++){const x=d.photos[i],dat=typeof x==='string'?x:(x?.data||x?.src);if(dat&&map.has('outlets|'+sid))jobs.push({source:'outlets',sid,itemId:map.get('outlets|'+sid),photoId:x?.id||('outlet-'+sid+'-'+i),data:dat})}let done=0;for(const j of jobs){const blob=dataUrlToBlob(j.data),path=user.id+'/'+p.id+'/'+j.source+'/'+j.sid+'/'+crypto.randomUUID()+'.'+ext(blob.type);const {error:ue}=await sb.storage.from('site-photos').upload(path,blob,{contentType:blob.type});if(ue)throw ue;const {error:me}=await sb.from('field_photos').insert({project_id:p.id,item_id:j.itemId,source_photo_id:j.photoId,storage_path:path,file_name:path.split('/').pop(),mime_type:blob.type});if(me)throw me;done++;bar.style.width=(45+Math.round(54*done/Math.max(1,jobs.length)))+'%';say('사진 '+done+' / '+jobs.length+' 업로드 중…')}bar.style.width='100%';say('완료! 항목 '+rows.length+'개와 사진 '+jobs.length+'장을 옮겼습니다.');setTimeout(()=>location.href='./cloud-review.html?project='+p.id,900)}catch(err){console.error(err);say('가져오기 실패: '+(err.message||err));importBtn.disabled=false}};
</script></body></html>
