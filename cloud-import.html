<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>기존 현장기록 가져오기</title><style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#20242a;--muted:#697078;--line:#ddd9d2;--blue:#315d8c;--green:#2f7d4a;--orange:#9a6422;--red:#a84040;--soft:#eef3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 14px 80px}a{color:inherit}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.04em}.topbar .right{display:flex;gap:7px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:750;text-decoration:none;cursor:pointer}
button.primary,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.good{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,35,40,.06);margin:12px 0}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);font:inherit}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 5px}.muted{color:var(--muted)}.msg{white-space:pre-wrap;font-size:13px;color:var(--muted);line-height:1.55}.hidden{display:none!important}
@media(max-width:700px){main{padding:16px 10px 78px}.topbar{align-items:flex-start;flex-direction:column}.topbar .right{width:100%}.topbar .right>*{flex:1;text-align:center}input,textarea,select{font-size:16px}}

.drop{border:2px dashed #b7c2ce;border-radius:16px;padding:22px;text-align:center;background:#fafcff}.progress{height:10px;background:#e6e8eb;border-radius:999px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:var(--green);transition:.15s}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.summary div{padding:10px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.summary b{display:block;font-size:20px}.summary span{font-size:11px;color:var(--muted)}@media(max-width:650px){.summary{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="topbar"><div><h1>기존 현장기록 가져오기</h1><div class="muted">JSON의 기록과 사진을 Supabase DB + Private Storage로 한 번에 옮깁니다.</div></div><div class="right"><a class="btn" href="./cloud-review.html">현장결과</a><button id="logout">로그아웃</button></div></div><section class="card"><div class="drop"><input id="file" type="file" accept=".json,application/json"><p class="muted">`interior_site_backup_....json` 파일을 선택하세요.</p></div><div id="preview" class="hidden"><div class="summary"><div><b id="nLight">0</b><span>조명 항목</span></div><div><b id="nOutlet">0</b><span>콘센트 항목</span></div><div><b id="nPhotos">0</b><span>사진</span></div><div><b id="nCustom">0</b><span>직접 추가</span></div></div><button class="good" id="importBtn" style="width:100%;margin-top:14px">Supabase로 가져오기</button></div><div class="progress hidden" id="prog"><i></i></div><div class="msg" id="msg"></div></section><section class="card"><b>중복 가져오기 주의</b><p class="muted">같은 백업을 여러 번 가져오지 않는 것을 권장합니다. 이미 같은 프로젝트가 있으면 가져오기 전에 경고합니다.</p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=createInteriorSupabase();
const LIGHTING_MAP={}; const LIGHT_ROOMS={}; const OUTLET_MAP={};
let payload=null,user=null;
const msg=document.getElementById('msg'),prog=document.getElementById('prog'),bar=prog.querySelector('i');
function setMsg(x){msg.textContent=x}
function statusLight(d,def){if(d?.decisionStatus==='hold')return 'hold';if(d?.action?.trim())return 'todo';if(d?.decisionText?.trim())return 'confirmed';if(d?.checked||d?.consulted)return 'review';return def?.critical?'todo':'review'}
function statusOutlet(d){if(d?.finalized||d?.finalDecision?.trim())return 'confirmed';if(d?.decisionStatus==='보류'||d?.decisionStatus==='변경 필요')return 'hold';if(d?.followup?.trim())return 'todo';if(d?.checked||d?.consulted)return 'review';return 'todo'}
function dataUrlToBlob(dataUrl){const [head,b64]=dataUrl.split(',');const mime=(head.match(/data:(.*?);base64/)||[])[1]||'image/jpeg';const bin=atob(b64);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function extFor(m){return m==='image/png'?'png':m==='image/webp'?'webp':'jpg'}
function cleanName(s){return String(s||'item').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,80)}
async function buildMaps(){try{const [lt,ot]=await Promise.all([fetch('./lighting.html').then(r=>r.text()),fetch('./outlets.html').then(r=>r.text())]);const sm=lt.match(/const SEED=(\{.*?\});\s*let state=/s);if(sm){const seed=JSON.parse(sm[1]);Object.assign(LIGHT_ROOMS,Object.fromEntries(seed.rooms.map(r=>[r.id,r.name])));Object.assign(LIGHTING_MAP,Object.fromEntries(seed.items.map(i=>[i.id,i])));}const rm=ot.match(/const rooms = (\[.*?\]);\s*const STORAGE_KEY/s);if(rm){const rooms=JSON.parse(rm[1]);for(const r of rooms){r.items.forEach((it,i)=>{OUTLET_MAP[r.id+'-'+i]={room:r.id,roomName:r.name,title:it[0],details:[it[1]],critical:r.priority==='high',priority:it[2],visibility:it[3]};});}}}catch(e){console.warn('definition map load failed',e)}}
async function authGuard(){await buildMaps();const {data}=await sb.auth.getUser();if(!data.user){location.href='./cloud-login.html';return}user=data.user}
authGuard();
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./cloud-login.html'};
document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;setMsg('파일 읽는 중…');try{payload=JSON.parse(await f.text());if(payload.app!=='interior-site-check-backup')throw new Error('예상한 백업 형식이 아닙니다.');const li=Object.keys(payload.lighting?.data?.state?.items||{}).length,oi=Object.keys(payload.outlets?.data?.items||{}).length,lp=(payload.lighting?.photos||[]).length,op=payload.outlets?.photoCount||0,cu=(payload.lighting?.data?.customItems||[]).length;document.getElementById('nLight').textContent=li;document.getElementById('nOutlet').textContent=oi;document.getElementById('nPhotos').textContent=lp+op;document.getElementById('nCustom').textContent=cu;document.getElementById('preview').classList.remove('hidden');setMsg('백업 확인 완료. 아래 버튼을 누르면 클라우드로 옮깁니다.');}catch(err){payload=null;setMsg('파일 오류: '+err.message)}};
document.getElementById('importBtn').onclick=async()=>{if(!payload||!user)return;const btn=document.getElementById('importBtn');btn.disabled=true;prog.classList.remove('hidden');bar.style.width='2%';try{
 const meta=payload.lighting?.data?.state?.meta||{};const projectName=meta.name||'인테리어 현장기록';const meetingDate=meta.meetingDate||null;
 const {data:existing,error:exErr}=await sb.from('projects').select('id,name,meeting_date').eq('name',projectName).limit(5);if(exErr)throw exErr;
 let proj=null;const same=existing?.find(x=>String(x.meeting_date||'')===String(meetingDate||''));
 if(same){const {count,error:cErr}=await sb.from('field_items').select('id',{count:'exact',head:true}).eq('project_id',same.id);if(cErr)throw cErr;if((count||0)===0){proj=same;setMsg('이전 실패 때 생성된 빈 프로젝트를 재사용합니다…')}else if(!confirm('같은 이름/회의일자의 프로젝트에 이미 '+count+'개 항목이 있습니다. 그래도 새 프로젝트로 가져올까요?')){btn.disabled=false;return}}
 if(!proj){const {data:newProj,error:pErr}=await sb.from('projects').insert({owner_id:user.id,name:projectName,meeting_date:meetingDate,consultant:meta.consultant||null,source_exported_at:payload.exportedAt||null}).select().single();if(pErr)throw pErr;proj=newProj;}
 const rows=[];let order=0;const lightState=payload.lighting?.data?.state?.items||{};const customs=payload.lighting?.data?.customItems||[];const customById=Object.fromEntries(customs.map(x=>[x.id,x]));
 for(const [sid,d] of Object.entries(lightState)){const def=LIGHTING_MAP[sid]||customById[sid]||{room:'common',title:sid,details:[],critical:false};rows.push({project_id:proj.id,source:'lighting',source_item_id:sid,room_id:def.room||'common',room_name:LIGHT_ROOMS[def.room]||def.room||'기타',title:def.title||sid,details:def.details||[],critical:!!def.critical,checked:!!d.checked,consulted:!!d.consulted,finalized:false,decision_status:d.decisionStatus||'undecided',workflow_status:statusLight(d,def),consult_note:d.consultNote||null,decision_text:d.decisionText||null,action:d.action||null,owner_name:d.owner||null,raw_data:d,sort_order:order++})}
 const outletState=payload.outlets?.data?.items||{};for(const [sid,d] of Object.entries(outletState)){const def=OUTLET_MAP[sid]||{room:'common',roomName:'기타',title:sid,details:[],critical:false};rows.push({project_id:proj.id,source:'outlets',source_item_id:sid,room_id:def.room||'common',room_name:def.roomName||def.room||'기타',title:def.title||sid,details:def.details||[],critical:!!def.critical,checked:!!d.checked,consulted:!!d.consulted,finalized:!!d.finalized,decision_status:d.decisionStatus||'',workflow_status:statusOutlet(d),consult_note:d.teamNote||null,decision_text:d.finalDecision||null,action:d.followup||null,owner_name:null,count_text:d.count||null,height_text:d.height||null,type_text:d.type||null,circuit_text:d.circuit||null,change_type:d.changeType||null,raw_data:d,sort_order:order++})}
 setMsg('항목 '+rows.length+'개 업로드 중…');bar.style.width='12%';
 const inserted=[];for(let i=0;i<rows.length;i+=40){const chunk=rows.slice(i,i+40);const {data:ins,error}=await sb.from('field_items').insert(chunk).select('id,source,source_item_id');if(error)throw error;inserted.push(...ins);bar.style.width=(12+Math.round(35*(i+chunk.length)/rows.length))+'%';}
 const idMap=new Map(inserted.map(x=>[x.source+'|'+x.source_item_id,x.id]));
 const jobs=[];for(const ph of (payload.lighting?.photos||[])){if(ph?.data&&idMap.has('lighting|'+ph.itemId))jobs.push({source:'lighting',sid:ph.itemId,itemId:idMap.get('lighting|'+ph.itemId),photoId:ph.id||crypto.randomUUID(),data:ph.data})}
 for(const [sid,d] of Object.entries(outletState)){for(let i=0;i<(d.photos||[]).length;i++){const x=d.photos[i];const dat=typeof x==='string'?x:(x?.data||x?.src);if(dat&&idMap.has('outlets|'+sid))jobs.push({source:'outlets',sid,itemId:idMap.get('outlets|'+sid),photoId:(x?.id||('outlet-'+sid+'-'+i)),data:dat})}}
 let done=0;for(const j of jobs){const blob=dataUrlToBlob(j.data),ext=extFor(blob.type),path=user.id+'/'+proj.id+'/'+j.source+'/'+cleanName(j.sid)+'/'+crypto.randomUUID()+'.'+ext;const {error:uErr}=await sb.storage.from('site-photos').upload(path,blob,{contentType:blob.type,upsert:false});if(uErr)throw uErr;const {error:mErr}=await sb.from('field_photos').insert({project_id:proj.id,item_id:j.itemId,source_photo_id:j.photoId,storage_path:path,file_name:path.split('/').pop(),mime_type:blob.type});if(mErr)throw mErr;done++;bar.style.width=(48+Math.round(50*done/Math.max(1,jobs.length)))+'%';setMsg('사진 업로드 '+done+' / '+jobs.length+'…')}
 bar.style.width='100%';setMsg('완료! 항목 '+rows.length+'개, 사진 '+jobs.length+'장을 클라우드로 옮겼습니다.\n잠시 후 현장결과 화면으로 이동합니다.');setTimeout(()=>location.href='./cloud-review.html?project='+proj.id,1200);
}catch(err){console.error(err);setMsg('가져오기 실패: '+(err.message||err));btn.disabled=false}};
</script></body></html>
