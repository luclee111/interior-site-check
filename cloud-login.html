<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>현장관리 로그인</title><style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#20242a;--muted:#697078;--line:#ddd9d2;--blue:#315d8c;--green:#2f7d4a;--orange:#9a6422;--red:#a84040;--soft:#eef3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 14px 80px}a{color:inherit}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.04em}.topbar .right{display:flex;gap:7px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:750;text-decoration:none;cursor:pointer}
button.primary,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.good{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,35,40,.06);margin:12px 0}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);font:inherit}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 5px}.muted{color:var(--muted)}.msg{white-space:pre-wrap;font-size:13px;color:var(--muted);line-height:1.55}.hidden{display:none!important}
@media(max-width:700px){main{padding:16px 10px 78px}.topbar{align-items:flex-start;flex-direction:column}.topbar .right{width:100%}.topbar .right>*{flex:1;text-align:center}input,textarea,select{font-size:16px}}
.login{max-width:480px;margin:8vh auto 0}.login h1{font-size:32px;margin:0 0 8px;letter-spacing:-.04em}.login button{width:100%;margin-top:12px;padding:13px}.back{display:inline-block;margin-bottom:16px;color:var(--muted);text-decoration:none}</style></head><body><main><div class="login"><a class="back" href="./">← 홈</a><section class="card"><h1>☁️ 현장관리 로그인</h1><p class="muted">Supabase에 저장된 현장 확인사항과 사진을 모든 브라우저에서 동일하게 봅니다.</p><button class="good" id="githubBtn" type="button">GitHub로 로그인</button><div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:var(--muted);font-size:12px"><span style="height:1px;background:var(--line);flex:1"></span><span>또는 이메일</span><span style="height:1px;background:var(--line);flex:1"></span></div><label>이메일</label><input id="email" type="email" autocomplete="email" placeholder="이메일"><label>비밀번호</label><input id="password" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="primary" id="loginBtn">로그인</button><div class="msg" id="msg"></div></section><section class="card"><b>로그인 방식</b><p class="muted">GitHub Provider가 활성화되어 있으므로 위의 GitHub 로그인 버튼을 사용하면 됩니다.</p></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=createInteriorSupabase(),msg=document.getElementById('msg');
(async()=>{const {data}=await sb.auth.getSession();if(data.session)location.href='./cloud-review.html';})();
document.getElementById('githubBtn').onclick=async()=>{msg.textContent='GitHub 로그인으로 이동 중…';const redirectTo=new URL('./cloud-review.html',location.href).href;const {error}=await sb.auth.signInWithOAuth({provider:'github',options:{redirectTo}});if(error)msg.textContent='GitHub 로그인 시작 실패: '+error.message;};
document.getElementById('loginBtn').onclick=async()=>{msg.textContent='로그인 중…';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await sb.auth.signInWithPassword({email,password});if(error){msg.textContent='로그인 실패: '+error.message;return}location.href='./cloud-review.html';};
</script></body></html>
