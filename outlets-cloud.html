<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>콘센트·통신 · Supabase 동기화</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f3ef}#app{position:fixed;inset:0;width:100%;height:100dvh;border:0;background:#f5f3ef}.loading{position:fixed;inset:0;display:grid;place-items:center;font-family:system-ui,sans-serif;color:#445;background:#f5f3ef;z-index:5}.loading.hide{display:none}</style></head><body><div class="loading" id="loading">☁️ Supabase 기록 불러오는 중…</div><iframe id="app" src="./outlets.html?embedded=1" title="콘센트·통신 · Supabase 동기화"></iframe><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
(async()=>{const sb=createInteriorSupabase();window.__sb=sb;const {data,error}=await sb.auth.getUser();if(error||!data.user){location.href='./cloud-login.html?next='+encodeURIComponent(location.pathname+location.search);return}window.__cloudUser=data.user;const requested=new URLSearchParams(location.search).get('project');const {data:projects,error:pe}=await sb.from('projects').select('*').order('created_at',{ascending:false}).limit(20);if(pe){document.getElementById('loading').textContent='프로젝트 로드 실패: '+pe.message;return}let p=requested?projects?.find(x=>x.id===requested):projects?.[0];if(!p){location.href='./cloud-import.html';return}window.__cloudProject=p;const frame=document.getElementById('app');frame.onload=()=>{const doc=frame.contentDocument;const s=doc.createElement('script');s.src='./outlets-cloud-bridge.js';s.onload=()=>document.getElementById('loading').classList.add('hide');s.onerror=()=>document.getElementById('loading').textContent='동기화 모듈 로드 실패';doc.body.appendChild(s)};})();
</script></body></html>
