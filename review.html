<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>현장 결과 · 해야 할 일</title><style>:root{--bg:#f3f1ec;--paper:#fffdfa;--ink:#242624;--muted:#77746e;--line:#ddd8cf;--green:#54725e;--blue:#526e89;--amber:#a7835a;--red:#b9634b;--shadow:0 10px 30px rgba(39,36,31,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 16px 90px}header{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;margin:4px 0 16px}h1{font-size:clamp(26px,4vw,42px);letter-spacing:-.04em;margin:0 0 6px}.sub{color:var(--muted);font-size:13px}.bar{display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:20;background:rgba(243,241,236,.94);backdrop-filter:blur(12px);padding:10px 0}.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:9px 12px;font-weight:800;color:var(--ink);text-decoration:none}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.dash{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:12px 0}.metric{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:var(--shadow)}.metric b{display:block;font-size:24px}.metric span{font-size:11px;color:var(--muted)}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:14px 0}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;font-size:14px}.filters{display:flex;gap:6px;overflow:auto;padding:2px 0 10px}.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}.empty,.notice{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;color:var(--muted)}.room{margin:18px 0}.room h2{font-size:21px;margin:0 0 9px}.cards{display:grid;gap:10px}.card{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 6px 20px rgba(39,36,31,.05)}.top{display:grid;grid-template-columns:1fr auto;gap:10px}.title{font-weight:900;font-size:16px}.id{color:var(--muted);font-size:10px;margin-left:6px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.badge{font-size:10px;border-radius:999px;padding:4px 7px;background:#efede8}.badge.todo{background:#fff0e7;color:#8d452f}.badge.decision{background:#eaf3ec;color:#315b3e}.badge.reviewed{background:#eaf0f6;color:#405d78}.badge.hold{background:#f2eadf;color:#765e40}.note{white-space:pre-wrap;background:#f8f6f2;border-radius:11px;padding:10px;margin-top:8px;font-size:13px;line-height:1.55}.note b{display:block;font-size:10px;color:var(--muted);margin-bottom:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stateBtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 9px;font-size:11px;font-weight:800}.stateBtn.on[data-s=confirmed]{background:#e6f1e8;border-color:#94b79c;color:#315b3e}.stateBtn.on[data-s=todo]{background:#fff0e7;border-color:#d9aa91;color:#8d452f}.stateBtn.on[data-s=hold]{background:#f2eadf;border-color:#c9b28e;color:#765e40}.stateBtn.on[data-s=done]{background:#edf0f2;border-color:#adb6bd;color:#4c5962}.photoBtn{border:0;background:#222;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800}.taskbox{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start}.taskbox input{margin-top:4px;width:18px;height:18px}.taskbox textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:10px;padding:9px;resize:vertical}.modal{display:none;position:fixed;inset:0;background:rgba(15,18,20,.96);z-index:1000;color:#fff}.modal.open{display:flex;flex-direction:column}.modalbar{display:flex;align-items:center;gap:8px;padding:10px}.modalbar b{margin-right:auto}.modalbar button{border:1px solid #555;background:#25292d;color:#fff;border-radius:9px;padding:8px 10px}.gallery{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;padding:10px}.gallery img{width:100%;height:auto;border-radius:10px;background:#fff}.footerNav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:6px;overflow:auto;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(255,253,250,.96);border-top:1px solid var(--line)}.footerNav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800}@media(max-width:820px){.wrap{padding:12px 10px 100px}header{display:block}.dash{grid-template-columns:repeat(2,1fr)}.metric:last-child{grid-column:1/-1}.toolbar{grid-template-columns:1fr}.bar{overflow:auto;flex-wrap:nowrap}.bar .btn{white-space:nowrap}.footerNav{display:flex}.card{padding:12px}.top{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}}@media print{.bar,.toolbar,.filters,.actions,.footerNav,.modal{display:none!important}.card,.metric{box-shadow:none;break-inside:avoid}.wrap{max-width:none}}</style></head><body><div class="wrap"><header><div><h1>현장 결과 · 해야 할 일</h1><div class="sub">9/13 현장 확인기록과 사진을 다시 묶고, 확정/추가확인/완료를 관리하는 사후 정리 화면</div></div><a class="btn" href="./">홈</a></header><div class="bar"><button class="btn primary" onclick="loadCurrent()">현재 브라우저 기록 불러오기</button><button class="btn" onclick="document.getElementById('file').click()">백업 JSON 가져오기</button><input id="file" hidden type="file" accept="application/json,.json" onchange="importFile(event)"><button class="btn" onclick="exportReview()">정리상태 백업</button><a class="btn" href="./backup.html">백업·복구</a><button class="btn" onclick="window.print()">인쇄/PDF</button></div><section class="dash"><div class="metric"><b id="mAll">0</b><span>전체 기록</span></div><div class="metric"><b id="mChecked">0</b><span>현장 확인</span></div><div class="metric"><b id="mTodo">0</b><span>해야 할 일</span></div><div class="metric"><b id="mConfirmed">0</b><span>확정 표시</span></div><div class="metric"><b id="mPhotos">0</b><span>현장 사진</span></div></section><div class="toolbar"><input id="search" placeholder="메모·항목 검색" oninput="render()"><select id="roomSel" onchange="render()"><option value="">모든 공간</option></select><select id="sortSel" onchange="render()"><option value="room">공간순</option><option value="todo">해야 할 일 우선</option><option value="photo">사진 많은 순</option></select></div><div class="filters" id="filters"></div><div id="app"><div class="notice">기록을 입력했던 같은 모바일 브라우저라면 <b>현재 브라우저 기록 불러오기</b>를 누르세요. 다른 브라우저/PC라면 방금 만든 백업 JSON을 가져오면 됩니다.</div></div></div><nav class="footerNav"><button onclick="setFilter('todo')">해야 할 일</button><button onclick="setFilter('decision')">결정 후보</button><button onclick="setFilter('photo')">사진 있음</button><button onclick="setFilter('all')">전체</button></nav><div class="modal" id="modal"><div class="modalbar"><b id="modalTitle">현장 사진</b><button onclick="closePhotos()">닫기</button></div><div class="gallery" id="gallery"></div></div><script>const ROOM={entrance:'현관',kitchen:'주방·다이닝',living:'거실·청음',study:'서재',bedroom:'침실',dressing:'드레스룸',frontbal:'전면 베란다',rearbal:'후면 베란다',bath:'욕실',common:'공통·최종 인수'};const DEF={"en-01":["entrance","천장 기본조명 사양 확인"],"en-02":["entrance","원형 거울과 다운라이트 실제 위치"],"en-03":["entrance","행잉장 하부 간접조명"],"en-04":["entrance","센서와 회로 방식"],"en-05":["entrance","상판 무드램프 전원"],"en-06":["entrance","현관 전체 색온도 통일감"],"ki-01":["kitchen","상부장 하부 LED 포함 범위"],"ki-02":["kitchen","상부장 하부 조명 시공 디테일"],"ki-03":["kitchen","색온도 실제 샘플 비교"],"ki-04":["kitchen","식탁 실제 위치 마스킹"],"ki-05":["kitchen","펜던트 전원은 식탁 중심으로"],"ki-06":["kitchen","펜던트 디밍·별도 회로"],"ki-07":["kitchen","주방 천장 다운라이트 최소화"],"ki-08":["kitchen","사람 그림자·상판 눈부심 확인"],"ki-09":["kitchen","COB는 목적이 있는 곳만"],"ki-10":["kitchen","조명 회로 최소 4개 분리"],"ki-11":["kitchen","원하는 저녁 장면 구현 확인"],"ki-12":["kitchen","다용도실 조명 완전 분리"],"ki-13":["kitchen","다용도실 가전 콘센트"],"ki-14":["kitchen","식탁 주변 콘센트 검토"],"ki-15":["kitchen","주방 상판 콘센트 개수·위치"],"ki-16":["kitchen","스위치 브랜드·모듈 구성"],"ki-17":["kitchen","디머 위치와 스위치 직관성"],"ki-18":["kitchen","펜던트 설치 하중·천장 보강"],"ki-19":["kitchen","하부 LED 유지보수·A/S"],"ki-20":["kitchen","조명 샘플 실제 점등"],"ki-21":["kitchen","회의 끝나기 전 도면 반영"],"li-01":["living","가구 위치 실제 크기 마스킹"],"li-02":["living","청음 가구 전원 위치"],"li-03":["living","턴테이블 ↔ 사운드바 매립 배관"],"li-04":["living","서브우퍼 전원"],"li-05":["living","시스템에어컨 단내림 간접조명"],"li-06":["living","목재 구조체 부채형 벽등 2개"],"li-07":["living","빌트인 거실장 니치 조명"],"li-08":["living","천장 다운라이트 최소화 + 밝은모드"],"li-09":["living","플로어램프 전원"],"li-10":["living","거실 색온도·색 편차"],"li-11":["living","거실 회로 분리"],"li-12":["living","실제 장면(Scene) 구현 확인"],"li-13":["living","이중 커튼과 조명 간섭"],"li-14":["living","회의 종료 전 받아올 자료"],"st-01":["study","서재 기본 조명"],"bd-01":["bedroom","침실 기본 조명"],"dr-01":["dressing","옷장 전면 수직광"],"fb-01":["frontbal","전면 베란다 야간풍경"],"rb-01":["rearbal","후면 베란다 실용조명"],"ba-01":["bath","욕실 거울/기본광"],"co-01":["common","조명 제품 사양표 받기"],"co-02":["common","수정 도면과 회로표 확보"],"co-03":["common","시공 담당 구분"],"co-04":["common","유지보수 접근성"]};const DB='interiorReviewDB',STORE='backup',RKEY='interior-review-state-v1';let backup=null,items=[],filter='todo',review=JSON.parse(localStorage.getItem(RKEY)||'{}');function esc(s){return String(s||'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[m]))}function saveReview(){localStorage.setItem(RKEY,JSON.stringify(review));stats()}function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveBackup(v){const d=await db();await new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite'),q=t.objectStore(STORE).put(v,'latest');q.onsuccess=res;q.onerror=()=>rej(q.error)});d.close()}async function getBackup(){const d=await db();const v=await new Promise(res=>{const t=d.transaction(STORE,'readonly'),q=t.objectStore(STORE).get('latest');q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)});d.close();return v}async function lightPhotos(){return new Promise(resolve=>{try{const r=indexedDB.open('renoFieldPhotos',1);r.onerror=()=>resolve([]);r.onsuccess=()=>{try{const t=r.result.transaction('photos','readonly'),q=t.objectStore('photos').getAll();q.onsuccess=()=>resolve(q.result||[]);q.onerror=()=>resolve([])}catch(e){resolve([])}}}catch(e){resolve([])}})}async function loadCurrent(){const l=JSON.parse(localStorage.getItem('renovation-lighting-field-v1')||'null'),o=JSON.parse(localStorage.getItem('outlet-site-check-v1')||'null'),p=await lightPhotos();if(!l&&!o)return alert('이 브라우저에서 기존 기록을 찾지 못했습니다. 백업 JSON을 가져와주세요.');backup={app:'interior-site-check-backup',version:2,lighting:{data:l,photos:p},outlets:{data:o}};await saveBackup(backup);build();}async function importFile(e){const f=e.target.files[0];if(!f)return;try{const v=JSON.parse(await f.text());backup=v;await saveBackup(v);build();}catch(x){alert('JSON을 읽지 못했습니다: '+x.message)}}function customMap(){const a=backup?.lighting?.data?.customItems||[];const m={};a.forEach(x=>m[x.id]=x);return m}function build(){const s=backup?.lighting?.data?.state?.items||{};const cm=customMap(),ph=backup?.lighting?.photos||[];const pc={};ph.forEach(p=>pc[p.itemId]=(pc[p.itemId]||0)+1);items=Object.entries(s).map(([id,v])=>{const c=cm[id],d=DEF[id],room=c?.room||d?.[0]||'common',title=c?.title||d?.[1]||id,details=(c?.details||[]).join('\n');return{id,room,title,details,v,photos:pc[id]||0,rawPhotos:ph.filter(p=>p.itemId===id)}});setupRooms();render();}function setupRooms(){const s=document.getElementById('roomSel'),cur=s.value;s.innerHTML='<option value="">모든 공간</option>'+Object.entries(ROOM).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');s.value=cur}function autoStatus(x){const v=x.v,r=review[x.id]||{};if(r.state)return r.state;if(v.decisionStatus==='hold')return'todo';if((v.action||'').trim())return'todo';if((v.decisionText||'').trim())return'decision';if(!v.checked&&!v.consulted)return'unreviewed';if(v.consulted)return'reviewed';return'checked'}function needsTodo(x){const r=review[x.id]||{},txt=[x.v.consultNote,x.v.decisionText,x.v.action,x.details].join(' ');return r.state==='todo'||x.v.decisionStatus==='hold'||(!x.v.checked&&!x.v.consulted)||/추가.{0,6}(확인|문의)|확인.{0,4}(필요|해)|정해|변경 필요|결정 필요|불가|교체 가능|알아봐|전달|받아올/.test(txt)}function isDecision(x){return autoStatus(x)==='decision'||autoStatus(x)==='confirmed'||/(결정|진행|하기로|필요 없음|사용|주백색|전구색|3000k|총 4개|추가안하기)/i.test((x.v.consultNote||'')+' '+(x.v.decisionText||''))}function setFilter(f){filter=f;document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b.dataset.f===f));render()}function setState(id,s){review[id]=review[id]||{};review[id].state=(review[id].state===s?'':s);saveReview();render()}function taskEdit(id,val){review[id]=review[id]||{};review[id].task=val;saveReview()}function taskDone(id,on){review[id]=review[id]||{};review[id].taskDone=on;saveReview();render()}function statusBadge(x){const s=autoStatus(x);if(s==='confirmed')return'<span class="badge decision">확정</span>';if(s==='todo')return'<span class="badge todo">해야 함</span>';if(s==='hold')return'<span class="badge hold">보류</span>';if(s==='decision')return'<span class="badge decision">결정 기록 있음</span>';if(s==='reviewed')return'<span class="badge reviewed">상담 완료</span>';if(s==='checked')return'<span class="badge reviewed">현장 확인</span>';return'<span class="badge">미확인</span>'}function card(x){const v=x.v,r=review[x.id]||{},todo=needsTodo(x),task=r.task||v.action||((v.decisionStatus==='hold'||todo)?'추가 확인 후 최종 결정':'');return`<article class="card"><div class="top"><div><div class="title">${esc(x.title)} <span class="id">${esc(x.id)}</span></div><div class="badges">${statusBadge(x)}${v.checked?'<span class="badge">✓ 직접확인</span>':''}${v.consulted?'<span class="badge">💬 상담</span>':''}${x.photos?`<span class="badge">📷 ${x.photos}</span>`:''}</div></div>${x.photos?`<button class="photoBtn" onclick="openPhotos('${x.id}')">사진 보기</button>`:''}</div>${x.details?`<div class="note"><b>직접 추가한 체크내용</b>${esc(x.details)}</div>`:''}${v.consultNote?`<div class="note"><b>현장 상담 기록</b>${esc(v.consultNote)}</div>`:''}${v.decisionText?`<div class="note"><b>결정 메모</b>${esc(v.decisionText)}</div>`:''}<div class="actions"><button data-s="confirmed" class="stateBtn ${r.state==='confirmed'?'on':''}" onclick="setState('${x.id}','confirmed')">확정</button><button data-s="todo" class="stateBtn ${r.state==='todo'?'on':''}" onclick="setState('${x.id}','todo')">해야 함</button><button data-s="hold" class="stateBtn ${r.state==='hold'?'on':''}" onclick="setState('${x.id}','hold')">보류</button><button data-s="done" class="stateBtn ${r.state==='done'?'on':''}" onclick="setState('${x.id}','done')">종료</button></div>${(todo||r.task)?`<div class="taskbox"><input type="checkbox" ${r.taskDone?'checked':''} onchange="taskDone('${x.id}',this.checked)"><textarea placeholder="후속 할 일" oninput="taskEdit('${x.id}',this.value)">${esc(task)}</textarea></div>`:''}</article>`}function render(){if(!backup)return;const q=document.getElementById('search').value.trim().toLowerCase(),room=document.getElementById('roomSel').value,sort=document.getElementById('sortSel').value;let a=items.filter(x=>!room||x.room===room).filter(x=>{const t=(x.title+' '+x.details+' '+(x.v.consultNote||'')+' '+(x.v.decisionText||'')).toLowerCase();return!q||t.includes(q)}).filter(x=>filter==='all'||(filter==='todo'&&needsTodo(x)&&!(review[x.id]?.taskDone))||(filter==='decision'&&isDecision(x))||(filter==='photo'&&x.photos>0)||(filter==='unchecked'&&!x.v.checked));if(sort==='todo')a.sort((x,y)=>Number(needsTodo(y))-Number(needsTodo(x)));if(sort==='photo')a.sort((x,y)=>y.photos-x.photos);const groups={};a.forEach(x=>(groups[x.room]??=[]).push(x));document.getElementById('app').innerHTML=a.length?Object.entries(groups).map(([r,z])=>`<section class="room"><h2>${ROOM[r]||r} <span class="id">${z.length}</span></h2><div class="cards">${z.map(card).join('')}</div></section>`).join(''):'<div class="empty">조건에 맞는 항목이 없습니다.</div>';stats()}function stats(){const all=items.length,checked=items.filter(x=>x.v.checked).length,todo=items.filter(x=>needsTodo(x)&&!review[x.id]?.taskDone).length,conf=items.filter(x=>review[x.id]?.state==='confirmed').length,photos=items.reduce((n,x)=>n+x.photos,0);mAll.textContent=all;mChecked.textContent=checked;mTodo.textContent=todo;mConfirmed.textContent=conf;mPhotos.textContent=photos}function openPhotos(id){const x=items.find(i=>i.id===id);if(!x)return;modalTitle.textContent=(ROOM[x.room]||x.room)+' · '+x.title;gallery.innerHTML=x.rawPhotos.map((p,i)=>`<img loading="lazy" alt="현장사진 ${i+1}" src="${p.data}">`).join('');modal.classList.add('open');document.body.style.overflow='hidden'}function closePhotos(){modal.classList.remove('open');gallery.innerHTML='';document.body.style.overflow=''}function exportReview(){const obj={exportedAt:new Date().toISOString(),review};const b=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='interior_review_status_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}function makeFilters(){filters.innerHTML=[['todo','해야 할 일'],['decision','결정 후보'],['photo','사진 있음'],['unchecked','미확인'],['all','전체']].map(([f,n])=>`<button data-f="${f}" class="chip ${f===filter?'on':''}" onclick="setFilter('${f}')">${n}</button>`).join('')}makeFilters();(async()=>{backup=await getBackup();if(backup)build()})();</script></body></html>
