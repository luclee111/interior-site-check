<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>클라우드 현장결과</title><style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#20242a;--muted:#697078;--line:#ddd9d2;--blue:#315d8c;--green:#2f7d4a;--orange:#9a6422;--red:#a84040;--soft:#eef3f8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1100px;margin:auto;padding:24px 14px 80px}a{color:inherit}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:18px}.topbar h1{margin:0;font-size:clamp(25px,4vw,38px);letter-spacing:-.04em}.topbar .right{display:flex;gap:7px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:750;text-decoration:none;cursor:pointer}
button.primary,.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}button.good{background:var(--green);border-color:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 8px 24px rgba(30,35,40,.06);margin:12px 0}
input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;color:var(--ink);font:inherit}
label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:10px 0 5px}.muted{color:var(--muted)}.msg{white-space:pre-wrap;font-size:13px;color:var(--muted);line-height:1.55}.hidden{display:none!important}
@media(max-width:700px){main{padding:16px 10px 78px}.topbar{align-items:flex-start;flex-direction:column}.topbar .right{width:100%}.topbar .right>*{flex:1;text-align:center}input,textarea,select{font-size:16px}}
.toolbar{display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.stats button{padding:12px 8px}.stats b{display:block;font-size:21px}.stats span{font-size:10px;color:var(--muted)}.stats button.on{background:var(--ink);color:#fff}.stats button.on span{color:#ddd}.item{padding:0;overflow:hidden}.itemHead{padding:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.itemHead h3{margin:0;font-size:17px}.meta{font-size:11px;color:var(--muted);margin-top:4px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;background:#f1f2f3;margin-right:4px}.badge.critical{background:#fff0e8;color:#9a4b21}.body{padding:0 14px 14px}.noteBox{padding:10px;border:1px solid var(--line);border-radius:11px;margin:8px 0;white-space:pre-wrap;font-size:13px;line-height:1.5}.noteBox b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.photos{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}.photos img{height:130px;width:174px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;flex:0 0 auto}.edit{display:grid;grid-template-columns:180px 1fr;gap:8px;margin-top:10px}.edit textarea{min-height:72px}.save{grid-column:1/-1}.sourceTitle{font-size:13px;font-weight:850;letter-spacing:.05em;color:var(--muted);margin:22px 2px 8px}.empty{padding:40px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;display:none;align-items:center;justify-content:center;padding:14px}.modal.open{display:flex}.modal img{max-width:100%;max-height:90vh;object-fit:contain}.modal button{position:absolute;right:12px;top:12px}@media(max-width:760px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(3,1fr)}.edit{grid-template-columns:1fr}.photos img{height:105px;width:140px}}</style></head><body><main><div class="topbar"><div><h1>☁️ 현장 결과 · 해야 할 일</h1><div class="muted" id="projectLabel">불러오는 중…</div></div><div class="right"><a class="btn" href="./cloud-import.html">JSON 가져오기</a><a class="btn" href="./">홈</a><button id="logout">로그아웃</button></div></div><section class="card"><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="메모·제목 검색"><select id="room"><option value="">모든 공간</option></select><select id="source"><option value="">조명+콘센트</option><option value="lighting">조명</option><option value="outlets">콘센트</option></select><select id="project"></select></div></section><div id="list"></div></main><div class="modal" id="modal"><button onclick="closePhoto()">닫기</button><img id="modalImg"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script><script>
const sb=createInteriorSupabase();let user=null,projects=[],items=[],photos=[],filterStatus='';
const list=document.getElementById('list'),roomSel=document.getElementById('room'),projectSel=document.getElementById('project');
async function guard(){const {data}=await sb.auth.getUser();if(!data.user){location.href='./cloud-login.html';return false}user=data.user;return true}
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./cloud-login.html'};
async function loadProjects(){const {data,error}=await sb.from('projects').select('*').order('created_at',{ascending:false});if(error)throw error;projects=data||[];projectSel.innerHTML=projects.map(p=>`<option value="${p.id}">${escapeHtml(p.name)} · ${p.meeting_date||''}</option>`).join('');const requested=new URLSearchParams(location.search).get('project');if(requested&&projects.some(p=>p.id===requested))projectSel.value=requested;if(!projectSel.value&&projects[0])projectSel.value=projects[0].id;projectSel.onchange=loadProject}
async function loadProject(){if(!projectSel.value){document.getElementById('projectLabel').textContent='프로젝트가 없습니다. JSON을 먼저 가져오세요.';list.innerHTML='<div class="empty">JSON 가져오기를 먼저 실행해주세요.</div>';return}const p=projects.find(x=>x.id===projectSel.value);document.getElementById('projectLabel').textContent=(p?.name||'')+(p?.meeting_date?' · '+p.meeting_date:'');const [a,b]=await Promise.all([sb.from('field_items').select('*').eq('project_id',projectSel.value).order('sort_order'),sb.from('field_photos').select('*').eq('project_id',projectSel.value)]);if(a.error)throw a.error;if(b.error)throw b.error;items=a.data||[];photos=b.data||[];const paths=photos.map(x=>x.storage_path);if(paths.length){const {data:signed,error}=await sb.storage.from('site-photos').createSignedUrls(paths,3600);if(!error)signed.forEach((x,i)=>photos[i].signed=x.signedUrl)}buildRoomOptions();render()}
function buildRoomOptions(){const cur=roomSel.value,names=[...new Set(items.map(x=>x.room_name).filter(Boolean))].sort();roomSel.innerHTML='<option value="">모든 공간</option>'+names.map(x=>`<option>${escapeHtml(x)}</option>`).join('');if(names.includes(cur))roomSel.value=cur}
function countStatus(s){return items.filter(x=>x.workflow_status===s).length}
function renderStats(){const defs=[['','전체',items.length],['todo','해야 함',countStatus('todo')],['hold','보류',countStatus('hold')],['review','검토',countStatus('review')],['confirmed','확정',countStatus('confirmed')],['done','완료',countStatus('done')]];document.getElementById('stats').innerHTML=defs.map(([k,n,c])=>`<button class="${filterStatus===k?'on':''}" onclick="setStatus('${k}')"><b>${c}</b><span>${n}</span></button>`).join('')}
function setStatus(s){filterStatus=s;render()}
function matches(x){const q=document.getElementById('search').value.trim().toLowerCase(),r=roomSel.value,s=document.getElementById('source').value;if(filterStatus&&x.workflow_status!==filterStatus)return false;if(r&&x.room_name!==r)return false;if(s&&x.source!==s)return false;if(q){const hay=[x.title,x.consult_note,x.decision_text,x.action,x.owner_name,x.room_name].join(' ').toLowerCase();if(!hay.includes(q))return false}return true}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function note(label,v){return v?`<div class="noteBox"><b>${label}</b>${escapeHtml(v)}</div>`:''}
function render(){renderStats();const data=items.filter(matches);if(!data.length){list.innerHTML='<div class="empty">조건에 맞는 항목이 없습니다.</div>';return}let html='',last='';for(const x of data){const key=x.room_name||'기타';if(key!==last){html+=`<div class="sourceTitle">${escapeHtml(key)}</div>`;last=key}const ph=photos.filter(p=>p.item_id===x.id&&p.signed);html+=`<article class="card item"><div class="itemHead"><div><h3>${x.source==='lighting'?'💡':'🔌'} ${escapeHtml(x.title)}</h3><div class="meta">${escapeHtml(x.source_item_id)} · ${x.checked?'직접확인 ✓':'미확인'} · ${x.consulted?'상담 ✓':'미상담'}</div><div style="margin-top:6px"><span class="badge">${escapeHtml(x.workflow_status)}</span>${x.critical?'<span class="badge critical">중요</span>':''}</div></div></div><div class="body">${note('팀장님/현장 메모',x.consult_note)}${note('최종 결정',x.decision_text)}${note('후속조치',x.action)}${ph.length?'<div class="photos">'+ph.map(p=>`<img src="${p.signed}" loading="lazy" onclick="openPhoto(this.src)">`).join('')+'</div>':''}<div class="edit"><select data-status="${x.id}"><option value="todo" ${x.workflow_status==='todo'?'selected':''}>해야 함</option><option value="hold" ${x.workflow_status==='hold'?'selected':''}>보류</option><option value="review" ${x.workflow_status==='review'?'selected':''}>검토</option><option value="confirmed" ${x.workflow_status==='confirmed'?'selected':''}>확정</option><option value="done" ${x.workflow_status==='done'?'selected':''}>완료</option></select><textarea data-action="${x.id}" placeholder="해야 할 일 / 후속조치">${escapeHtml(x.action||'')}</textarea><textarea data-decision="${x.id}" placeholder="최종 결정">${escapeHtml(x.decision_text||'')}</textarea><button class="save primary" onclick="saveItem('${x.id}')">이 항목 저장</button></div></div></article>`}list.innerHTML=html}
async function saveItem(id){const workflow_status=document.querySelector(`[data-status="${id}"]`).value,action=document.querySelector(`[data-action="${id}"]`).value,decision_text=document.querySelector(`[data-decision="${id}"]`).value;const {error}=await sb.from('field_items').update({workflow_status,action,decision_text}).eq('id',id);if(error){alert('저장 실패: '+error.message);return}const x=items.find(v=>v.id===id);Object.assign(x,{workflow_status,action,decision_text});render();}
function openPhoto(src){document.getElementById('modalImg').src=src;document.getElementById('modal').classList.add('open')}function closePhoto(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closePhoto()};
['search','room','source'].forEach(id=>document.getElementById(id).addEventListener('input',render));
(async()=>{if(!await guard())return;try{await loadProjects();await loadProject()}catch(e){console.error(e);list.innerHTML='<div class="card">오류: '+escapeHtml(e.message)+'</div>'}})();
</script></body></html>
