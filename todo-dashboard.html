<title>궁극의 대시보드 · 인테리어 SSOT</title>
<style>
:root{--bg:#f5f3ef;--card:#fff;--ink:#20242a;--muted:#697078;--line:#ddd9d2;--blue:#315d8c;--green:#2f7d4a;--red:#a94040;--orange:#a66b1f;--purple:#6c5b86;--shadow:0 8px 26px rgba(30,35,40,.07)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline:none}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(49,93,140,.28);outline-offset:2px}main{max-width:1180px;margin:auto;padding:22px 14px 90px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;color:var(--muted)}h1{margin:5px 0 0;font-size:clamp(30px,5vw,48px);line-height:1.05;letter-spacing:-.055em}.subtitle{margin:7px 0 0;color:var(--muted);font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap}.btn,button{border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);padding:10px 13px;font-weight:800;cursor:pointer;text-decoration:none;min-height:42px}.btn.primary,.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn:hover,button:hover{filter:brightness(.985)}.notice{margin-top:15px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:12px 14px;font-size:12px;line-height:1.6;color:var(--muted)}.notice b{color:var(--ink)}.progressPanel{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow)}.progressHead{display:flex;justify-content:space-between;gap:12px;align-items:center}.progressHead b{font-size:14px}.progressHead span{font-size:12px;color:var(--muted)}.bar{height:9px;background:#ecebe8;border-radius:999px;overflow:hidden;margin-top:9px}.bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .2s}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 14px}.summary button{background:#fff;padding:12px 9px}.summary button.on{background:var(--ink);color:#fff}.summary b{font-size:22px;display:block}.summary span{font-size:10px;color:var(--muted)}.summary button.on span{color:#ddd}.overview{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.miniPanel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:var(--shadow);min-height:130px}.miniPanel h2{font-size:14px;margin:0 0 10px}.miniItem{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid #efede9;font-size:12px}.miniItem:first-of-type{border-top:0}.miniItem button{padding:0;min-height:0;border:0;background:none;text-align:left;font-weight:800;color:var(--ink)}.miniTime{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:5px;flex:0 0 auto}.toolbar{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;position:sticky;top:6px;z-index:20;background:rgba(245,243,239,.94);backdrop-filter:blur(10px);padding:10px 0}.toolbar input,.toolbar select{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:#fff;min-height:44px}.empty{padding:50px;text-align:center;color:var(--muted)}.todo{background:#fff;border:1px solid var(--line);border-radius:17px;margin:9px 0;box-shadow:0 6px 20px rgba(30,35,40,.045);overflow:hidden;scroll-margin-top:88px}.todo.done{opacity:.68}.todo.overdue{border-color:#e3b5ad}.head{display:grid;grid-template-columns:auto 1fr auto;gap:11px;padding:14px;align-items:start}.check{width:31px;height:31px;padding:0;min-height:31px;border-radius:9px;display:grid;place-items:center}.check.done{background:var(--green);border-color:var(--green);color:#fff}.title{font-size:16px;font-weight:900;line-height:1.35}.meta,.quickMeta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;border-radius:999px;padding:4px 7px;background:#f2f2f1;color:#5e646b;font-weight:800}.tag.p0{background:#fff0ed;color:#963b30}.tag.p1{background:#fff7e8;color:#80550e}.tag.p2{background:#eef4fb;color:#315d8c}.stage{font-size:10px;border-radius:999px;padding:5px 8px;font-weight:900;background:#eef1f4;color:#445}.stage.waiting{background:#fff5df;color:#80550e}.stage.ordered,.stage.scheduled{background:#f0ebfa;color:#5e4680}.stage.doing{background:#eaf3fb;color:#285d87}.stage.done{background:#eaf7ee;color:#286c42}.stage.blocked{background:#fff0ed;color:#963b30}.due.over{background:#fff0ed;color:#963b30}.due.soon{background:#fff7e8;color:#80550e}.nextLine{margin-top:8px;color:#4f565d;font-size:12px;line-height:1.5}.nextLine b{color:var(--ink)}.detailBtn{white-space:nowrap}.body{display:none;border-top:1px solid #efede9;padding:14px}.todo.open .body{display:block}.section{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}.section:first-child{margin-top:0;padding-top:0;border-top:0}.sectionHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:9px}.sectionHead h3{font-size:13px;margin:0}.sectionHead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid .wide{grid-column:span 2}.grid .full{grid-column:1/-1}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}.field textarea{min-height:72px;resize:vertical}.saveRow{display:flex;justify-content:flex-end;gap:8px;margin-top:9px}.dirty{background:#fff7e8!important;border-color:#dfbd82!important;color:#80550e!important}.history{display:grid;gap:7px}.historyItem{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:start;padding:9px 10px;border-radius:11px;background:#f8f8f7}.historyItem time{font-size:10px;color:var(--muted);white-space:nowrap}.historyItem p{margin:0;font-size:12px;line-height:1.5;white-space:pre-wrap}.iconBtn{padding:3px 7px;min-height:28px;font-size:11px}.addRow{display:grid;grid-template-columns:1fr auto;gap:7px;margin-top:8px}.addRow textarea{min-height:60px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;resize:vertical}.links{display:flex;gap:7px;flex-wrap:wrap}.linkChip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:6px 8px;background:#fff;font-size:11px;max-width:100%}.linkChip a{color:var(--blue);font-weight:800;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:310px}.linkChip a:hover{text-decoration:underline}.linkAdd{display:grid;grid-template-columns:120px 1fr 2fr auto;gap:7px;margin-top:9px}.linkAdd input,.linkAdd select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}.vendorBox{background:#f8fafc;border:1px solid #dbe3eb;border-radius:13px;padding:12px}.vendorBox h4{margin:0 0 8px;font-size:13px}.measureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.measure{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px}.measure b{display:block;font-size:11px;margin-bottom:4px}.measure span{font-size:11px;line-height:1.55;color:#51585f}.vendorText{font-size:12px;line-height:1.65;white-space:pre-wrap;color:#4f565d;margin:9px 0}.photos{display:flex;gap:7px;overflow-x:auto;padding-bottom:5px}.photo{flex:0 0 112px;position:relative}.photo img{width:112px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:10px;cursor:zoom-in;background:#eee}.photo small{display:block;margin-top:3px;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.photo .del{position:absolute;right:3px;top:3px;width:25px;height:25px;min-height:25px;padding:0;border:0;border-radius:50%;background:rgba(0,0,0,.65);color:#fff}.context{font-size:11px;line-height:1.6;color:#5d646c;background:#fafbfc;border-left:3px solid #cfd8e2;padding:9px 10px;white-space:pre-wrap}.modal{position:fixed;inset:0;background:rgba(10,13,17,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modal img{max-width:96vw;max-height:90vh;object-fit:contain}.modal button{position:absolute;right:14px;top:14px}.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#222;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800;z-index:110;transition:.18s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.warnText{color:#995715;font-weight:800}.subtle{color:var(--muted);font-size:11px;line-height:1.55}
@media(max-width:900px){.toolbar{grid-template-columns:2fr repeat(2,1fr)}.toolbar>*:nth-child(n+4){grid-column:auto}.grid{grid-template-columns:repeat(2,1fr)}.overview{grid-template-columns:1fr}.measureGrid{grid-template-columns:1fr 1fr}}
@media(max-width:640px){main{padding:16px 10px 75px}.top{flex-direction:column}.nav{width:100%}.nav>*{flex:1;text-align:center;padding:9px 7px}.summary{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr;top:2px}.toolbar #search{grid-column:1/-1}.head{grid-template-columns:auto 1fr}.detailBtn{grid-column:2;justify-self:start}.grid{grid-template-columns:1fr}.grid .wide,.grid .full{grid-column:1}.linkAdd{grid-template-columns:1fr}.addRow{grid-template-columns:1fr}.measureGrid{grid-template-columns:1fr}.photo{flex-basis:96px}.photo img{width:96px;height:72px}.progressHead{align-items:flex-start}.linkChip a{max-width:220px}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><div class="eyebrow">RENOVATION SINGLE SOURCE OF TRUTH</div><h1>궁극의 대시보드</h1><p class="subtitle" id="projectLabel">Supabase 기록을 불러오는 중…</p></div>
    <nav class="nav"><a class="btn" href="./">⌂ 홈</a><a class="btn" href="./ffe.html">📦 FF&E</a><a class="btn" href="./lighting-cloud.html">💡 조명</a><a class="btn" href="./outlets-cloud.html">🔌 콘센트</a><a class="btn" href="./cloud-review.html">☁️ 현장결과</a></nav>
  </div>
  <div class="notice"><b>이 페이지를 기준 정보로 사용합니다.</b> 각 할 일의 현재 단계, 담당, 기한, 다음 행동, 결정 결과, 진행기록, 상품·문의·견적·주문 링크와 현장사진을 한 곳에 모읍니다. 세부 정보는 필요할 때만 펼쳐 보이도록 구성했습니다.</div>
  <section class="progressPanel"><div class="progressHead"><b>전체 진행률</b><span id="progressText">불러오는 중…</span></div><div class="bar"><i id="progressBar"></i></div></section>
  <div class="summary" id="summary"></div>
  <section class="overview"><div class="miniPanel"><h2>🔥 지금 집중</h2><div id="focusList"></div></div><div class="miniPanel"><h2>🕘 최근 진행기록</h2><div id="recentList"></div></div></section>
  <section class="toolbar">
    <input id="search" placeholder="할 일·공간·진행기록·링크 검색" aria-label="검색">
    <select id="category" aria-label="카테고리"><option value="">모든 카테고리</option></select>
    <select id="priority" aria-label="우선순위"><option value="">모든 우선순위</option><option value="P0">P0 지금</option><option value="P1">P1 곧</option><option value="P2">P2 후공정</option></select>
    <select id="stageFilter" aria-label="진행단계"><option value="">모든 진행단계</option></select>
    <select id="owner" aria-label="담당"><option value="">모든 담당</option></select>
    <select id="sort" aria-label="정렬"><option value="priority">중요도순</option><option value="due">기한순</option><option value="recent">최근 업데이트순</option><option value="default">기본순</option></select>
  </section>
  <div id="list"><div class="empty">데이터를 불러오는 중…</div></div>
</main>
<div class="modal" id="photoModal" onclick="if(event.target===this)closePhoto()"><button onclick="closePhoto()">닫기</button><img id="modalImg" alt="현장사진 크게 보기"></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>

</body></html>
